<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="UTF-8">
        <title>Duyuru Paneli</title>
        <style>
            body {font-family: Arial, sans-serif;}
            #duyurular {margin-top: 20px;}
            .duyuru {
                padding: 10px;
                margin: 5px 0;
                background: #f1f1f1;
                border-radius: 5px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .sil {
                background: red;
                color: white;
                border: none;
                padding: 5px 10px;
                cursor: pointer;
                border-radius: 3px;
            }
        </style>
    </head>
    <body>
        <h1>Duyuru Paneli</h1>
        <input type="text" id="yeniDuyuru" placeholder="Yeni duyuru girin">
        <button id="ekle">Ekle</button>
        <div id="duyurular"></div>
        <script>
            const ekleButon= document.getElementById("ekle");
            const duyurular= document.getElementById("duyurular");
            ekleButon.addEventListener("click", function(){
                const metin= document.getElementById("yeniDuyuru").value;
                if(metin !=="") {
                    //yeni  duyuru div'i oluştur
                    const duyuru= document.createElement("div");
                    duyuru.classList.add("duyuru");
                    duyuru.textContent= metin;
                    //sil butonu ekle
                    const silButon= document.createElement("button");
                    silButon.textContent= "sil";
                    silButon.classList.add("sil");
                    //silme işlemi
                    silButon.addEventListener("click", function(){
                        duyuru.remove();
                    });
                    duyuru.appendChild(silButon);
                    duyurular.appendChild(duyuru);
                    //inputu temizle
                    document.getElementById("yeniDuyuru").value= "";
                }
            });
        </script>
    </body>
</html>
